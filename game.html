<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Vibe Lumberjack Endless World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Игровой экран */
        .game-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141d26;
        }

        canvas {
            display: block;
            background: #1b2836;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        /* Боковая панель улучшений внутри игры */
        .ui-panel {
            width: 260px;
            background: #0f172a;
            border-left: 2px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .upgrade-btn {
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            border: none;
            color: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: opacity 0.2s;
        }

        .upgrade-btn:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
        }

        .upgrade-btn span {
            font-size: 11px;
            color: #93c5fd;
        }

        .prestige-btn {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            margin-top: auto;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .prestige-btn:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Инструкция на экране */
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #cbd5e1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Игровой холст -->
    <div class="game-wrapper">
        <canvas id="game-canvas" width="540" height="500"></canvas>
        <div class="controls-hint">Управление: Стрелочки на клавиатуре или зажмите мышь/тапните по экрану в нужную сторону движения.</div>
    </div>

    <!-- Панель RPG Прокачки -->
    <div class="ui-panel">
        <div class="stat-box">
            <div class="stat-value" id="gold-txt">0 💰</div>
            <div class="stat-label">Баланс Золота</div>
        </div>

        <div class="stat-box">
            <div class="stat-value" id="dist-txt">0 м</div>
            <div class="stat-label">Дистанция от центра</div>
        </div>

        <button class="upgrade-btn" id="up-damage">
            Урон топора (+1)
            <span id="dmg-cost">Цена: 10 💰</span>
        </button>

        <button class="upgrade-btn" id="up-speed">
            Скорость бега
            <span id="speed-cost">Цена: 50 💰</span>
        </button>

        <div class="stat-box" style="margin-top: 15px;">
            <div class="stat-value" id="prestige-multiplier" style="color: #ffcc00;">x1.0</div>
            <div class="stat-label">Множитель Престижа</div>
        </div>

        <!-- Кнопка сброса (Престиж) -->
        <button class="prestige-btn" id="prestige-btn" disabled>
            ПРЕСТИЖ
            <div style="font-size: 10px; font-weight: normal; margin-top: 2px;" id="prestige-hint">Нужно отойти на 500м</div>
        </button>
    </div>

    <script src="game.js"></script>
</body>
</html>
